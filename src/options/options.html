<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>粉笔题目收进思源设置</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <h1>粉笔题目收进思源</h1>
      <form id="settings-form">
        <label>
          思源地址
          <input id="siyuanBaseUrl" name="siyuanBaseUrl" placeholder="http://127.0.0.1:6806" />
        </label>
        <label>
          API Token
          <input id="siyuanToken" name="siyuanToken" type="password" autocomplete="off" />
        </label>
        <label>
          目标文档块 ID
          <input id="targetBlockId" name="targetBlockId" />
        </label>
        <div class="actions">
          <button type="submit">保存</button>
          <button type="button" id="test-connection">测试连接</button>
        </div>
        <p id="status" role="status"></p>
      </form>
    </main>
    <script type="module" src="./options.js"></script>
  </body>
</html>
